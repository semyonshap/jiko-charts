image:
  repository: ghcr.io/semyonshap/ory-admin
  tag: "1.0.0"

service:
  port: 80
  targetPort: 8080

livenessProbe:
  path: /api/health

readinessProbe:
  path: /api/health

startupProbe:
  path: /api/health

env:
  KRATOS_ADMIN_URL: ""
  HYDRA_ADMIN_URL: ""
  KETO_OPL_URL: ""
  KETO_READ_URL: ""
  KETO_WRITE_URL: ""

extraConfigmaps: []
