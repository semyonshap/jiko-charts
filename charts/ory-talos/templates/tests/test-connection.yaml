apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "common.fullname" . }}-test-{{ randAlphaNum 5 | lower }}"
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "common.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": hook-succeeded
spec:
  containers:
    - name: test
      image: curlimages/curl:8.7.1
      command:
        - sh
        - -c
        - |
          curl -fsS http://{{ include "common.fullname" . }}:{{ .Values.service.http.port }}/health/ready \
            && echo "Talos is healthy"
  restartPolicy: Never
