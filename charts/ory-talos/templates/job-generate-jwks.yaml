{{- if .Values.secretsGeneration.jwks.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "common.fullname" . }}-generate-jwks
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "common.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        {{- include "common.selectorLabels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "common.jwksGeneratorName" . }}
      initContainers:
        - name: generate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          command:
            - sh
            - -c
            - |
              set -e
              talos jwk generate eddsa --kid {{ .Values.secretsGeneration.jwks.kid | quote }} --jwks > /shared/jwks.json
              test -s /shared/jwks.json
          volumeMounts:
            - name: shared
              mountPath: /shared
      containers:
        - name: apply
          image: "{{ .Values.secretsGeneration.jwks.kubectlImage.repository }}:{{ .Values.secretsGeneration.jwks.kubectlImage.tag }}"
          command:
            - sh
            - -c
            - |
              set -e
              if kubectl get secret {{ include "common.fullname" . }}-jwks -n {{ .Release.Namespace }} >/dev/null 2>&1; then
                echo "JWKS secret already exists — leaving it untouched"
                exit 0
              fi
              kubectl create secret generic {{ include "common.fullname" . }}-jwks \
                -n {{ .Release.Namespace }} \
                --from-file=jwks.json=/shared/jwks.json
          volumeMounts:
            - name: shared
              mountPath: /shared
      volumes:
        - name: shared
          emptyDir: {}
{{- end }}
