name: Release Helm Charts

on:
  push:
    branches: [main]
    paths:
      - "charts/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  detect-charts:
    runs-on: ubuntu-latest
    outputs:
      dirs: ${{ steps.find.outputs.dirs }}
    steps:
      - uses: actions/checkout@v4

      - name: Find chart directories
        id: find
        run: |
          dirs=$(find charts -mindepth 1 -maxdepth 1 -type d \
            -exec test -f '{}/Chart.yaml' \; -print \
            | jq -R -s -c 'split("\n")[:-1]')
          echo "dirs=$dirs" >> "$GITHUB_OUTPUT"

  release:
    needs: detect-charts
    if: needs.detect-charts.outputs.dirs != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJson(needs.detect-charts.outputs.dirs) }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v4.2.3

      - name: Read chart name/version
        id: info
        run: |
          echo "name=$(yq -r '.name' "${{ matrix.dir }}/Chart.yaml")" >> "$GITHUB_OUTPUT"
          echo "version=$(yq -r '.version' "${{ matrix.dir }}/Chart.yaml")" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip if this version already published
        id: check
        run: |
          if helm show chart \
              "oci://ghcr.io/${{ github.repository_owner }}/helm/${{ steps.info.outputs.name }}" \
              --version "${{ steps.info.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package and push
        if: steps.check.outputs.exists == 'false'
        run: |
          helm lint "${{ matrix.dir }}"
          helm package "${{ matrix.dir }}" --destination .release
          helm push ".release/${{ steps.info.outputs.name }}-${{ steps.info.outputs.version }}.tgz" \
            "oci://ghcr.io/${{ github.repository_owner }}"

      - name: Already published — skipping
        if: steps.check.outputs.exists == 'true'
        run: echo "${{ steps.info.outputs.name }}@${{ steps.info.outputs.version }} already exists, nothing to do."
