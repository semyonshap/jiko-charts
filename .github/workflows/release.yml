name: Release Helm Charts

on:
  push:
    branches: [main]
    paths:
      - "charts/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      OCI_BASE: oci://ghcr.io/${{ github.repository_owner }}/charts
    steps:
      - uses: actions/checkout@v7

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.18.4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Release all charts
        run: |
          set -euo pipefail

          mkdir -p .release

          for dir in charts/*/; do
            dir="${dir%/}"
            [ -f "$dir/Chart.yaml" ] || continue

            name=$(yq -r '.name' "$dir/Chart.yaml")
            version=$(yq -r '.version' "$dir/Chart.yaml")

            echo "::group::$name@$version ($dir)"

            if helm show chart "$OCI_BASE/$name" --version "$version" >/dev/null 2>&1; then
              echo "$name@$version already exists, skipping."
              echo "::endgroup::"
              continue
            fi

            helm dependency update "$dir"
            helm lint "$dir"
            helm package "$dir" --destination .release
            helm push ".release/$name-$version.tgz" "$OCI_BASE"

            echo "::endgroup::"
          done